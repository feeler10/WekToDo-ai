[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'wek-todo-agent-service'
version = '0.1.0'
description = 'FastAPI service for WekToDo-ai'
requires-python = '>=3.11'
dependencies = [
    'fastapi>=0.115,<1.0',
    'pydantic-settings>=2.7,<3.0',
    'uvicorn>=0.34,<1.0',
]

[project.optional-dependencies]
test = [
    'httpx>=0.27,<1.0',
    'pytest>=7.4,<9.0',
]

[tool.setuptools.packages.find]
include = ['app*']

[tool.pytest.ini_options]
addopts = '-ra -p no:cacheprovider'
pythonpath = ['.']
testpaths = ['tests']
