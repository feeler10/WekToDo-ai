[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'wek-todo-agent-service'
version = '0.2.2'
description = 'FastAPI service for WekToDo-ai'
requires-python = '>=3.11'
dependencies = [
    'fastapi>=0.115,<1.0',
    'langchain-openai>=1.1,<2.0',
    'langgraph>=1.0,<2.0',
    'langgraph-checkpoint-redis>=0.5,<0.6',
    'pydantic-settings>=2.7,<3.0',
    'redis>=5,<7',
    'uvicorn>=0.34,<1.0',
]

[project.optional-dependencies]
test = [
    'httpx>=0.27,<1.0',
    'fakeredis>=2.25,<3.0',
    'pytest>=7.4,<9.0',
]

[tool.setuptools.packages.find]
include = ['app*']

[tool.pytest.ini_options]
addopts = '-ra -p no:cacheprovider'
pythonpath = ['.']
testpaths = ['tests']
markers = [
    'integration: tests that require the Docker Redis service',
]
